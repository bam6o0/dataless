name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # dist/ is committed so that `npm i -g github:bam6o0/dataless` needs no
      # build step. Fail if it is stale.
      - run: npm run build

      - name: dist/ is up to date
        run: git diff --exit-code dist
